name : create meeting report
on:
  schedule:
    - cron:  '0 7 * * 5' #  Create at 7 am on Friday
jobs:
  get_repo:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps :
      - name: echo test
        run: |
          echo "start test"
      - name: Set up Python 
        uses: actions/setup-python@v7
        with:
            python-version: 3.12
      - name: do action checkout
        uses: actions/checkout@v5
      - name: get github repository
        env:
          SECRET2: ${{ secrets.SECRET2 }}
        run: |
          if [ -z "$SECRET2" ]; then echo "SECRET2 is not set!"; exit 1; else echo "SECRET2 is set!"; fi
          python -m pip install --upgrade setuptools wheel
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          python scripts/create_dev_meetings_report.py
      - name: check for changes
        run: git status
      - name: stage changed files
        run: git add .
      - name: email config
        run: | 
          git config --global user.name "Kirsty Feijen"
          git config --global user.email "astrokirsty@gmail.com"
      - name: commit changed files
        run: git commit -m 'auto create meeting report'
      - name: push changes
        run: git push
